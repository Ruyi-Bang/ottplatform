# Shared defaults. Supply real credentials through environment variables or the local profile.
spring.application.name=ottPlatform

security.token.secret=${SECURITY_TOKEN_SECRET:MASKED}
server.port=${PORT:8081}
spring.ai.openai.api-key=${OPENAI_API_KEY:MASKED}
spring.ai.openai.chat.options.model=gpt-5-chat-latest
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=500
spring.ai.openai.chat.options.stream=true
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
tmdb.auth.token=${TMDB_AUTH_TOKEN:MASKED}
tmdb.url=https://api.themoviedb.org/3/

content.country=US


# ===============================
# = Postgresql Database (Local Default)
# ===============================
# ---------- Postgresql on Persistent Disk ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MASKED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:MASKED}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MASKED}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = Logging (Optional, for SQL)
# ===============================
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace
# ---------- Management / Health ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# ---------- OpenAPI / Swagger UI ----------
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
